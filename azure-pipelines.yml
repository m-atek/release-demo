# Releases a service on Azure Pipelines: the same stage scripts, in the same
# order and with the same arguments, as Jenkins' release pipeline
# (jenkins/shared-library/vars/releasePipeline.groovy). The code stays on
# GitHub; every job runs on the self-hosted pool release-demo, the agent
# tools-host on the tools host (tools-host/azure-agent.sh), which reaches JFrog,
# Splunk and AWS as the Jenkins agent does. azure-pipelines/stage.yml does
# what releaseStage.groovy does around each stage.
#
# Only the Slack handler queues runs, as Release Bot, with the Jenkins job's
# parameters. The environment production has no approvers: one Invoke REST API
# check asks the approval bridge whether ServiceNow approved the change, and
# Production's first step, change.py wait, asks ServiceNow itself, so nothing
# deploys without the approval in ServiceNow, whatever happens in Azure
# DevOps. No secrets in Azure DevOps: the scripts read SSM through the tools
# host's role.

trigger: none
pr: none

parameters:
  - name: service
    type: string
  - name: jiraKey
    type: string
  - name: option
    type: string
    default: ""
  - name: requestedBy
    type: string
    default: ""
  - name: slackChannel
    type: string
    default: ""
  - name: slackTs
    type: string
    default: ""
  - name: requestedAt
    type: string
    default: ""

variables:
  SERVICE: ${{ parameters.service }}
  JIRA_KEY: ${{ parameters.jiraKey }}
  OPTION: ${{ parameters.option }}
  REQUESTED_BY: ${{ parameters.requestedBy }}
  SLACK_CHANNEL: ${{ parameters.slackChannel }}
  SLACK_TS: ${{ parameters.slackTs }}
  REQUESTED_AT: ${{ parameters.requestedAt }}
  # Azure's run, under the CI adapter's neutral names (scripts/ci_env.py). The
  # correlation id, azure-pipelines:<organization>/<project>:<run id>, is set
  # where the run state starts, from the organization's URL.
  RELEASE_CI_NAME: Azure Pipelines run
  RELEASE_RUN_ID: $(Build.BuildId)
  RELEASE_RUN_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
  RELEASE_BUILD_ID: ado-$(Build.BuildId)
  RELEASE_COMMIT: $(Build.SourceVersion)
  # The pinned images from jenkins/shared-library/vars/toolchain.groovy, by the same digests.
  SONAR: sonarsource/sonar-scanner-cli:12.2@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
  SYFT: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  GRYPE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
  # The agent's own cache for Syft and Grype, as the Jenkins agent has its own.
  CACHE: /data/azp-agent/cache

pool: release-demo

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        steps:
          - checkout: self
            clean: true
          - bash: |
              [ "$SERVICE" = orders-service ] || { echo "This pipeline releases orders-service, not $SERVICE."; exit 1; }
              rm -rf .release dist
              RELEASE_CORRELATION_ID="azure-pipelines:$(basename "$SYSTEM_COLLECTIONURI")/$SYSTEM_TEAMPROJECT:$BUILD_BUILDID" \
                python3 scripts/run_state.py init --service "$SERVICE" --jira-key "$JIRA_KEY" \
                  --option "$OPTION" --requested-by "$REQUESTED_BY" \
                  --slack-channel "$SLACK_CHANNEL" --slack-ts "$SLACK_TS" --requested-at "$REQUESTED_AT" &&
                python3 scripts/jira.py fix-version
            displayName: Run state
          - template: azure-pipelines/stage.yml
            parameters:
              stage: Build
              displayName: Build
              script: toolchain python3 scripts/build.py "$SERVICE" --jira-key "$JIRA_KEY"
          - template: azure-pipelines/state.yml
            parameters: {save: Build}

  - stage: Test
    displayName: Test
    jobs:
      - job: Test
        steps:
          - checkout: self
            clean: true
          - template: azure-pipelines/state.yml
            parameters: {restore: Build}
          - template: azure-pipelines/stage.yml
            parameters:
              stage: Test
              displayName: Test
              script: >-
                mkdir -p .release/reports &&
                toolchain sh -c "cd services/$SERVICE && python -m pytest -q -p no:cacheprovider
                --junitxml=$PWD/.release/reports/junit.xml --cov=. --cov-report=xml:$PWD/.release/reports/coverage.xml"
          - task: PublishTestResults@2
            displayName: Test results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: .release/reports/junit.xml
              failTaskOnFailedTests: false
          - template: azure-pipelines/state.yml
            parameters: {save: Test}

  - stage: Quality_gate
    displayName: Quality gate
    jobs:
      - job: Quality_gate
        displayName: Quality gate
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0  # the scanner reads blame, as from Jenkins' full clone
          - template: azure-pipelines/state.yml
            parameters: {restore: Test}
          - template: azure-pipelines/stage.yml
            parameters:
              stage: Quality gate
              displayName: Quality gate
              # The one value a container gets: the scanner's token, from release-demo-parameter,
              # as Jenkins' credential binding hands it over.
              script: |
                ARGS=$(python3 scripts/sonar_args.py "$SERVICE" "$VERSION") || return 1
                SONAR_TOKEN=$(release-demo-parameter sonar/token) || return 1
                export SONAR_TOKEN
                docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" --entrypoint sonar-scanner \
                  -e SONAR_TOKEN -e SONAR_HOST_URL=https://sonarcloud.io -e SONAR_USER_HOME=/tmp/sonar "$SONAR" $ARGS
          - template: azure-pipelines/state.yml
            parameters: {save: Quality_gate}

  - stage: SBOM_and_scan
    displayName: SBOM and scan
    jobs:
      - job: SBOM_and_scan
        displayName: SBOM and scan
        steps:
          - checkout: self
            clean: true
          - template: azure-pipelines/state.yml
            parameters: {restore: Quality_gate}
          - template: azure-pipelines/stage.yml
            parameters:
              stage: SBOM and scan
              displayName: SBOM and scan
              script: |
                local source=dir:/work/.release/package
                rm -rf .release/package && mkdir -p .release/package .release/reports "$CACHE/syft" "$CACHE/grype" || return 1
                python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
                  dist/"$SERVICE"/*.zip .release/package || return 1
                # A package that holds a container image as an OCI layout is scanned as that image.
                [ -f .release/package/image/index.json ] && source=oci-dir:/work/.release/package/image
                docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -v "$CACHE/syft:/cache" \
                  -e SYFT_CACHE_DIR=/cache -e TMPDIR=/cache "$SYFT" \
                  "$source" --source-name "$SERVICE" -o cyclonedx-json=/work/.release/reports/sbom.cdx.json || return 1
                docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -v "$CACHE/grype:/cache" \
                  -e GRYPE_DB_CACHE_DIR=/cache -e TMPDIR=/cache "$GRYPE" sbom:/work/.release/reports/sbom.cdx.json \
                  --fail-on critical -o table -o json=/work/.release/reports/grype.json
          - template: azure-pipelines/state.yml
            parameters: {save: SBOM_and_scan}

  - stage: Publish
    displayName: Publish
    jobs:
      - job: Publish
        steps:
          - checkout: self
            clean: true
          - template: azure-pipelines/state.yml
            parameters: {restore: SBOM_and_scan}
          - template: azure-pipelines/stage.yml
            parameters:
              stage: Publish
              displayName: Publish
              script: python3 scripts/publish.py "$SERVICE"
          - template: azure-pipelines/state.yml
            parameters: {save: Publish}

  - stage: Staging
    displayName: Staging
    jobs:
      - deployment: Staging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                  clean: true
                - template: azure-pipelines/state.yml
                  parameters: {restore: Publish}
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Staging
                    displayName: Staging
                    environment: staging
                    script: python3 scripts/deploy.py "$SERVICE" staging
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Check staging
                    displayName: Check staging
                    environment: staging
                    script: |
                      python3 scripts/check.py "$SERVICE" staging --version "$VERSION" --url "$(state deploys.staging.url)" && return 0
                      python3 scripts/deploy.py "$SERVICE" staging --back
                      python3 scripts/run_state.py set "stop_reason=Staging check failed: staging is back on $(state deploys.staging.previous_version)."
                      return 1
                - template: azure-pipelines/state.yml
                  parameters: {save: Staging}

  - stage: Change
    displayName: Change
    jobs:
      - job: Change
        steps:
          - checkout: self
            clean: true
          - template: azure-pipelines/state.yml
            parameters: {restore: Staging}
          - template: azure-pipelines/stage.yml
            parameters:
              stage: Change
              displayName: Change
              script: python3 scripts/change.py open
          # The approval waits between this stage and Production, on production's check:
          # its row in Slack starts here, and the run takes the change's number.
          - bash: |
              if [ "$(python3 scripts/run_state.py get change.type)" = standard ]; then
                python3 scripts/notify.py stage Approval skipped &&
                  python3 scripts/events.py --stage Approval --result skipped &&
                  python3 scripts/change.py note "Approval: skipped. A standard change is pre-approved."
              else
                python3 scripts/notify.py stage Approval running &&
                  python3 scripts/run_state.py set "approval_started_at=$(date +%s.%N)"
              fi &&
              echo "##vso[build.updatebuildnumber]$SERVICE $(python3 scripts/run_state.py get version) · $(python3 scripts/run_state.py get change.number)"
            displayName: Approval waits for ServiceNow
          - template: azure-pipelines/state.yml
            parameters: {save: Change}

  - stage: Production
    displayName: Production
    jobs:
      - deployment: Production
        # No approvers: one check, "ServiceNow change approved", asks the approval bridge.
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                  clean: true
                - template: azure-pipelines/state.yml
                  parameters: {restore: Change}
                # Returns at once after the check passed; after an admin's bypass it waits for Alex,
                # as Jenkins' Approval stage does, and refuses an approval by the person who asked.
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Approval
                    displayName: Wait for the ServiceNow approval
                    begins: false
                    startedAt: approval_started_at
                    condition: and(succeeded(), ne(variables['CHANGE_TYPE'], 'standard'))
                    script: |
                      local APPROVER
                      python3 scripts/change.py wait || return 1
                      APPROVER=$(state change.approved_by)
                      python3 scripts/notify.py line "Approved by $APPROVER in ServiceNow."
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Production
                    displayName: Mark the change in progress
                    environment: production
                    ends: false
                    script: python3 scripts/change.py implement
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Production
                    displayName: Deploy to production
                    environment: production
                    deploy: true
                    begins: false
                    script: python3 scripts/deploy.py "$SERVICE" production
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Check production
                    displayName: Check production
                    environment: production
                    script: |
                      check_production() {
                        python3 scripts/check.py "$SERVICE" production --version "$VERSION" --url "$(state deploys.production.url)" && return 0
                        roll_back
                        return 1
                      }
                      # rollBack() in releasePipeline.groovy: the previous version back, checked, and recorded everywhere.
                      roll_back() {
                        local started previous recovery check_notes
                        started=$(date +%s.%N)
                        previous=$(state deploys.production.previous_version)
                        python3 scripts/deploy.py "$SERVICE" production --back || return 1
                        if ! python3 scripts/check.py "$SERVICE" production --version "$previous" --url "$(state deploys.production.url)"; then
                          python3 scripts/notify.py line "The previous version, $previous, fails its check too. Look now."
                          python3 scripts/run_state.py set "stop_reason=Rolled back to $previous, but it fails its check too."
                          return 1
                        fi
                        recovery=$(python3 -c 'import sys, time; print(f"{time.time() - float(sys.argv[1]):.0f}")' "$started")
                        check_notes=$(state check.notes)
                        python3 scripts/events.py --stage Rollback --result rolled-back --environment production --recovery-seconds "$recovery" &&
                          python3 scripts/events.py annotate "$SERVICE rolled back to $previous" --tags "rollback,$SERVICE" &&
                          python3 scripts/notify.py finish rolled-back --previous "$previous" &&
                          python3 scripts/change.py close unsuccessful --notes "${check_notes:+$check_notes }Production check failed. The pipeline rolled back to $previous automatically in ${recovery}s and checked it. Total time: $(state total). Build: $RELEASE_RUN_URL" &&
                          python3 scripts/jira.py comment "Release of $SERVICE $(state version) failed its production check and was rolled back to $previous in ${recovery}s. Change: $(state change.number). Build: $RELEASE_RUN_URL"
                        python3 scripts/run_state.py set "stop_reason=Production check failed: rolled back to $previous."
                      }
                      check_production
                - template: azure-pipelines/stage.yml
                  parameters:
                    stage: Record
                    displayName: Record
                    script: |
                      python3 scripts/publish.py "$SERVICE" --release &&
                        python3 scripts/notify.py finish live &&
                        python3 scripts/jira.py comment "Released $SERVICE $VERSION in $(state change.number). Live in $(state total). Build: $RELEASE_RUN_URL" &&
                        python3 scripts/jira.py release &&
                        python3 scripts/tag.py &&
                        python3 scripts/events.py annotate "$SERVICE $VERSION released ($JIRA_KEY)" --tags "release,$SERVICE" &&
                        python3 scripts/change.py close successful --notes "Released $SERVICE $VERSION. Total time: $(state total). Build: $RELEASE_RUN_URL"
                - template: azure-pipelines/state.yml
                  parameters: {save: Production}

  # stopped() in releasePipeline.groovy: Slack says where it stopped. Before
  # production the open change is cancelled; after the production deploy it
  # closes unsuccessful; a cancelled run says "Cancelled after [total]." After
  # a rollback, which told everyone, it does nothing.
  - stage: Stopped
    displayName: Stopped
    dependsOn: [Build, Test, Quality_gate, SBOM_and_scan, Publish, Staging, Change, Production]
    condition: or(failed(), canceled())
    jobs:
      - job: Stopped
        condition: always()
        steps:
          - checkout: self
            clean: true
            condition: always()
          - download: current
            patterns: state-*/state.tgz
            displayName: Every stage's run state
            condition: always()
          - bash: echo "##vso[task.setvariable variable=STOP]cancelled"
            displayName: The run was cancelled
            condition: canceled()
          - bash: |
              state() { python3 scripts/run_state.py get "$1"; }
              # The newest run state: the stage that stopped published it, also when it failed.
              for stage in Production Change Staging Publish SBOM_and_scan Quality_gate Test Build; do
                file="$(Pipeline.Workspace)/state-$stage/state.tgz"
                [ -f "$file" ] && { tar -xzf "$file"; break; }
              done
              [ -f .release/state.json ] || { echo "The release never started: nothing to stop."; exit 0; }
              [ -z "$(state total)" ] || { echo "The rollback already told everyone."; exit 0; }
              failed=$(jq -r '[.stages | to_entries[] | select(.value.status == "failed") | .key] | first // ""' .release/state.json)
              reason=$(state stop_reason)
              reason=${reason:-${failed:+$failed failed}}
              # The notes add their own full stop, so one the reason ends with goes.
              reason=$(printf '%s' "${reason:-the run stopped}" | sed -E 's/\.+$//')
              if [ "$STOP" = cancelled ]; then
                python3 scripts/notify.py finish cancelled
                reason="the run was cancelled in Azure DevOps"
              else
                python3 scripts/notify.py finish failed
              fi
              if [ -n "$(state change.closed)" ]; then
                echo "The change is closed already: $(state change.closed)."
              elif [ -n "$(state deploys.production.number)" ]; then
                python3 scripts/change.py close unsuccessful --notes "The release stopped after the production deploy: $reason. Look at production now."
              else
                python3 scripts/change.py cancel --notes "The release stopped: $reason. Nothing changed in production."
              fi
              exit 0
            displayName: Stopped
            condition: always()
