# Rolling updates that never drop below the desired count: one extra pod at a
# time, and an old pod goes only once a new one is ready. On one node a
# PodDisruptionBudget would change nothing a rollout does, so there is none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  # A new pod counts as available after 10 seconds ready, which keeps the
  # rollout visible on a 15-second scrape.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "catalog.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalog.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: catalog
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required: the image is pinned by digest" .Values.image.digest }}"
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: ENVIRONMENT, value: {{ .Values.environment | quote }} }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- range $name, $value := .Values.settings }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
          # Ready: takes traffic. Alive: keeps running. A pod can be alive but not ready.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Leaves time for the Service to stop sending traffic before the pod stops.
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
