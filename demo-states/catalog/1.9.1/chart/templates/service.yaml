apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "catalog.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- with .Values.nodePort }}
      nodePort: {{ . }}
      {{- end }}
