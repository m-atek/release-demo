# Every SSM parameter the platform reads, under /release-demo/<name>.
#
# source: you        you type it into scripts/secrets.py
#         script     a setup script writes it (named in the help)
#         host       the tools host writes it at boot
#         terraform  Terraform generates it or gets it from a provider
#
# Terraform creates the names of everything except the "terraform" ones with
# the value "unset" and never touches the value again. secure: false means a
# plain String: not secret, but still kept out of the public repository.

github/repository:
  source: script
  secure: false
  help: "owner/release-demo. Written by scripts/github_app.py."
github/app-id:
  source: script
  secure: false
  help: "The GitHub App's id. Written by scripts/github_app.py."
github/app-private-key:
  source: script
  secure: true
  help: "The GitHub App's private key (PEM). Written by scripts/github_app.py."

slack/bot-token:
  source: you
  secure: true
  help: "Slack app, OAuth & Permissions, Bot User OAuth Token (xoxb-...)."
  pattern: "^xoxb-"
  hint: "the Bot User OAuth Token starts with xoxb-"
slack/signing-secret:
  source: you
  secure: true
  help: "Slack app, Basic Information, App Credentials, Signing Secret (click Show). Not the App-Level Token (xapp-)."
  pattern: "^[0-9a-f]{32}$"
  hint: "a signing secret is 32 characters, 0-9 and a-f"
slack/channel-id:
  source: you
  secure: false
  help: "#releases: click the channel name, the Channel ID at the bottom (C...). A channel link works too."
  pattern: "^[CG][A-Z0-9]{8,}$"
  hint: "a channel id starts with C and has 9 or more capitals and digits"
slack/member-id/mateusz:
  source: you
  secure: false
  help: "Your Slack member id: your profile, the three dots, Copy member ID (U...)."
  pattern: "^[UW][A-Z0-9]{8,}$"
  hint: "a member id starts with U and has 9 or more capitals and digits"
slack/member-id/sam:
  source: you
  secure: false
  help: "Sam Developer's Slack member id: his profile, the three dots, Copy member ID (U...)."
  pattern: "^[UW][A-Z0-9]{8,}$"
  hint: "a member id starts with U and has 9 or more capitals and digits"

servicenow/instance-url:
  source: you
  secure: true
  help: "Your PDI's URL, https://devNNNNNN.service-now.com."
  pattern: "^https://dev[0-9]+\\.service-now\\.com$"
servicenow/admin-password:
  source: you
  secure: true
  help: "Password of the ServiceNow setup user release-demo.setup (roles admin and snc_basic_auth_api_access), which servicenow_setup.py signs in as."
servicenow/sam-password:
  source: you
  secure: true
  help: "A password you choose for Sam Developer in ServiceNow. You sign in as Sam."
servicenow/alex-password:
  source: you
  secure: true
  help: "A password you choose for Alex Change Manager in ServiceNow. You sign in as Alex to approve."
servicenow/release-pipeline-password:
  source: script
  secure: true
  help: "Password of the ServiceNow user release.pipeline. Written by scripts/servicenow_setup.py."

jira/site-url:
  source: you
  secure: true
  help: "Your Jira Cloud site, https://<site>.atlassian.net."
  pattern: "^https://[a-z0-9-]+\\.atlassian\\.net$"
jira/email:
  source: you
  secure: true
  help: "The email of the Jira user Release Pipeline (your third address)."
jira/api-token:
  source: you
  secure: true
  help: "Signed in as Release Pipeline: id.atlassian.com, Security, API tokens, Create API token."

grafana/stack-url:
  source: you
  secure: true
  help: "Your Grafana Cloud stack, https://<stack>.grafana.net."
  pattern: "^https://[a-z0-9-]+\\.grafana\\.net$"
grafana/logs-url:
  source: you
  secure: true
  help: "Loki details page: the URL, https://logs-prod-...grafana.net."
grafana/logs-user:
  source: you
  secure: true
  help: "Loki details page: the User (a number)."
  pattern: "^[0-9]+$"
grafana/logs-token:
  source: you
  secure: true
  help: "Access policy token with logs:write (glc_...)."
grafana/service-account-token:
  source: you
  secure: true
  help: "Stack, Administration, Service accounts, Editor role, token (glsa_...)."
  pattern: "^glsa_"
grafana/external-id:
  source: you
  secure: true
  help: "CloudWatch data source, Grafana Assume Role: the External ID it shows."
grafana/metrics-url:
  source: you
  secure: true
  help: "Demo 8. Grafana Cloud portal, your stack, Prometheus, Details: the Remote Write Endpoint (https://prometheus-prod-...grafana.net/api/prom/push)."
  pattern: "^https://prometheus-[a-z0-9-]+\\.grafana\\.net/api/prom/push$"
grafana/metrics-user:
  source: you
  secure: true
  help: "Demo 8. The same Prometheus Details page: the Username / Instance ID (a number)."
  pattern: "^[0-9]+$"
grafana/metrics-token:
  source: you
  secure: true
  help: "Demo 8. An access policy token with metrics:write (glc_...), for Grafana Alloy in the k3s cluster."
grafana/setup-token:
  source: you
  secure: true
  help: "Stack, Administration, Users and access, Service accounts: release-demo-setup with the Admin role, token (glsa_...). Only scripts/grafana_setup.py uses it, on your Mac, to save the CloudWatch data source; never the tools host."
  pattern: "^glsa_"
  hint: "a service account token starts with glsa_"

sonar/organization:
  source: you
  secure: false
  help: "Your SonarQube Cloud organization key."
sonar/token:
  source: you
  secure: true
  help: "SonarQube Cloud, My Account, Security, Generate token."

cloudflare/api-token:
  source: you
  secure: true
  help: "API token limited to es.nl with Zone DNS, Account Cloudflare Tunnel and Account Access edit."
cloudflare/account-id:
  source: you
  secure: true
  help: "Cloudflare dashboard, es.nl overview, right column: Account ID."
  pattern: "^[0-9a-f]{32}$"
cloudflare/zone-id:
  source: you
  secure: true
  help: "Cloudflare dashboard, es.nl overview, right column: Zone ID."
  pattern: "^[0-9a-f]{32}$"
cloudflare/access-email:
  source: you
  secure: true
  help: "The email Cloudflare Access lets into Jenkins, JCR and Splunk."

jcr/admin-password:
  source: you
  secure: true
  help: "The JCR admin password you set in its setup wizard. scripts/jcr_setup.py and reset.py use it on the host."

jcr/token:
  source: script
  secure: true
  help: "Access token of the JCR user release-pipeline. Written by scripts/jcr_setup.py on the tools host."

jcr/store-fleet-token:
  # Demo 1's own root (infra/demos/1-windows) creates the name, so the main root doesn't.
  source: terraform
  secure: true
  help: "Read-only JCR token (readers group) the store fleet downloads store-sync with. Written by scripts/demos/windows/jcr_token.py."

splunk/general-terms-accepted:
