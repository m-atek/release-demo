  secure: false
  help: "When Mateusz accepted Splunk's General Terms. Written by scripts/tools.sh after his yes; the host starts Splunk only when set."

jenkins/release-bot-api-token:
  source: host
  secure: true
  help: "API token of the Jenkins user release-bot, for the Slack handler. Written by the tools host."

jenkins/admin-password:
  source: terraform
  secure: true
  help: "Jenkins user admin. Sign in with it through Cloudflare Access."
jenkins/release-bot-password:
  source: terraform
  secure: true
  help: "Jenkins user release-bot."
jcr/db-password:
  source: terraform
  secure: true
  help: "JCR's PostgreSQL user."
splunk/password:
  source: terraform
  secure: true
  help: "Splunk's admin password (Splunk Free has no login, the CLI uses it)."
splunk/hec-token:
  source: terraform
  secure: true
  help: "Splunk HTTP Event Collector token."
cloudflare/tunnel-token:
  source: terraform
  secure: true
  help: "Token cloudflared runs the tunnel with."
cloudflare/slack-handler-client-id:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for the Slack handler: client id."
cloudflare/slack-handler-client-secret:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for the Slack handler: client secret."
cloudflare/mac-agent-client-id:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for demo 6's Mac build agent, on Jenkins: client id."
cloudflare/mac-agent-client-secret:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for demo 6's Mac build agent, on Jenkins: client secret."
cloudflare/windows-agent-client-id:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for demo 6's Windows build agent, on Jenkins: client id."
cloudflare/windows-agent-client-secret:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for demo 6's Windows build agent, on Jenkins: client secret."
jenkins/agent-secret/mac:
  source: host
  secure: true
  help: "The Jenkins secret of the node mac, demo 6's Mac build agent. Written by the tools host (agent_secrets.py)."
jenkins/agent-secret/windows:
  source: host
  secure: true
  help: "The Jenkins secret of the node windows, demo 6's Windows build agent. Written by the tools host (agent_secrets.py)."

pricing-api/staging/api-url:
  source: terraform
  secure: false
  help: "pricing-api's API Gateway address in staging. Written by infra/demos/4-apis."
pricing-api/production/api-url:
  source: terraform
  secure: false
  help: "pricing-api's API Gateway address in production. Written by infra/demos/4-apis."

infracost/cli-token:
  source: you
  secure: true
  help: "Infracost Cloud, Org settings, CLI tokens (dashboard.infracost.io/org/<org>/settings/cli-tokens): a service account token for CI. Demo 2 prices pull requests with it."

anthropic/api-key:
  source: you
  secure: true
  help: "Claude Console (platform.claude.com), workspace release-demo, API keys: a key for the demo's AI steps (videos 12 and 13). The workspace's spend limit caps its cost."
  pattern: "^sk-ant-"
  hint: "an Anthropic API key starts with sk-ant-"

# Demo 5, one release to three clouds (infra/demos/5-three-clouds). Ids, not
# secrets, but kept out of the public repository. No cloud keys: each cloud
# trusts Jenkins's ID tokens instead.
azure/subscription-id:
  source: you
  secure: false
  help: "Your pay-as-you-go Azure subscription's id. After az login: az account show --query id --output tsv."
  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  hint: "a subscription id looks like 0a1b2c3d-..., 36 characters"
gcp/project-id:
  source: you
  secure: false
  help: "The Google Cloud project's id, not its name or number: gcloud projects list."
  pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
  hint: "a project id is 6 to 30 lower-case letters, digits and dashes"
jenkins/oidc-issuer:
  source: terraform
  secure: false
  help: "The issuer of Jenkins's ID tokens: a public S3 bucket with only the discovery files. casc.yaml reads it as ${jenkins-oidc-issuer}. Terraform, infra/demos/5-three-clouds."
clouds/aws:
  source: terraform
  secure: false
  help: "quote-service on AWS: the deploy role, the registry, the function URLs. Terraform, infra/demos/5-three-clouds."
clouds/azure:
  source: terraform
  secure: false
  help: "quote-service on Azure: tenant, subscription, deploy identity, registry, app addresses. Terraform, infra/demos/5-three-clouds/azure."
clouds/gcp:
  source: terraform
  secure: false
  help: "quote-service on Google Cloud: project, identity provider, deploy account, registry, addresses. Terraform, infra/demos/5-three-clouds/gcp."

# Demo 7, store-floor (scripts/demos/mobile). Signing values reach the build
# job as Jenkins credentials, which JCasC loads from these at the host's boot.
store-floor/bucket:
  source: terraform
  secure: false
  help: "Demo 7's bucket: fastlane match under match/, the stand-ins' state under standins/. Written by infra/demos/7-mobile."
store-floor/orders-url:
  source: terraform
  secure: false
  help: "orders-service's production URL, for Store Floor's order list. Written by infra/demos/7-mobile."
store-floor/android-upload-keystore:
