  secure: true
  help: "Cloudflare Access service token for GitHub Actions' runners, on JFrog Container Registry only: client id."
cloudflare/github-actions-client-secret:
  source: terraform
  secure: true
  help: "Cloudflare Access service token for GitHub Actions' runners, on JFrog Container Registry only: client secret."
github/run-state-key:
  source: terraform
  secure: true
  help: "The key release.yml's jobs encrypt the run state they pass on with, since a public repository's artifacts are public. Written by infra/demos/14-github-actions."

# Demo 17, GitLab CI: the pipeline (.gitlab-ci.yml) on GitLab.com Free, its
# runner on the tools host, and which CI /release starts.
gitlab/api-token:
  source: you
  secure: true
  help: "GitLab.com, signed in as the demo-only account: avatar, Edit profile, Personal access tokens, Add new token, scopes api and create_runner, expiring within a year. Only the Mac's scripts read it; the tools host may not."
  pattern: "^glpat-"
  hint: "a GitLab personal access token starts with glpat-"
gitlab/project-id:
  source: script
  secure: false
  help: "The GitLab project's numeric id. Written by scripts/demos/gitlab_port/setup.py."
gitlab/trigger-token:
  source: script
  secure: true
  help: "The project's pipeline trigger token, which the Slack handler starts the pipeline with. Written by scripts/demos/gitlab_port/setup.py."
gitlab/runner-token:
  source: script
  secure: true
  help: "The project runner tools-host's authentication token, which it registers with once. Written by scripts/demos/gitlab_port/setup.py."
ci/orders-service:
  source: script
  secure: false
  help: "Which CI /release orders-service starts: jenkins (the default, and whenever another CI's demo is down), gitlab-ci or azure-pipelines. Set by scripts/demo.sh up and down."

# Demo 22, Azure DevOps: the pipeline (azure-pipelines.yml), its agent on the
# tools host, and Release Bot, which signs in with no stored secret
# (infra/demos/22-azure-devops-approval). Ids, not secrets, but kept out of
# the public repository.
azure-devops/organization:
  source: script
  secure: false
  help: "The Azure DevOps organization's name, as in dev.azure.com/<name>. Written by scripts/demos/azure_devops/setup.py --apply --organization <name>."
  pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,48}[A-Za-z0-9]$"
azure-devops/project-id:
  source: script
  secure: false
  help: "The project release-demo's id. Written by scripts/demos/azure_devops/setup.py."
azure-devops/pipeline-id:
  source: script
  secure: false
  help: "The release pipeline's id, from azure-pipelines.yml. Written by scripts/demos/azure_devops/setup.py."
azure-devops/tenant-id:
  source: terraform
  secure: false
  help: "The Entra tenant Release Bot is registered in. Written by infra/demos/22-azure-devops-approval."
azure-devops/release-bot-client-id:
  source: terraform
  secure: false
  help: "Release Bot's application (client) id. Written by infra/demos/22-azure-devops-approval."
azure-devops/agent-registration-token:
  source: you
  secure: true
  help: "dev.azure.com, your organization, User settings, Personal access tokens, New Token: scope Agent Pools (Read & manage), expiring in a day. The agent on the tools host registers with it once, then signs in with its own key."

# Demo 19, Argo CD on the cluster host (infra/demos/19-argocd-hand-edit), and
# the bridge's POST /events it records drift through (infra/approval_bridge.tf).
cluster-host/address:
  source: terraform
  secure: false
  help: "The cluster host's fixed private address. Written by infra/argocd.tf, which also points argocd-demo.es.nl at it; infra/demos/19-argocd-hand-edit gives the host this address."
cluster-host/settings:
  source: terraform
  secure: false
  help: "What the cluster host's boot needs, as JSON: the repository and JCR on the tools host's private address. Written by infra/demos/19-argocd-hand-edit."
argocd/pipeline-token:
  source: script
  secure: true
  help: "API token of Argo CD's local account release-pipeline, which may get and sync catalog-production only. Generated on the cluster host by scripts/demos/argocd/host/setup.py; the fix pipeline and reset.py use it from the tools host."
bridge/events-token:
  source: terraform
  secure: true
  help: "Bearer token for the event bridge's POST /events, which the drift recorder on the cluster host sends. Generated by infra/approval_bridge.tf."

# Demo 23, the runbook assistant on Databricks (infra/demos/23-databricks-rag).
databricks/host:
  source: you
  secure: false
  help: "Your Databricks workspace's URL, https://<workspace>.cloud.databricks.com: the address the CLI profile release-demo signs in to."
  pattern: "^https://"
  hint: "a workspace URL starts with https://"
databricks/catalog:
  source: script
  secure: false
  help: "The workspace's catalog, which express setup named. Written by scripts/demos/rag/bootstrap.sh."
databricks/client-id:
  source: terraform
  secure: false
  help: "The service principal release-pipeline's application id. Written by infra/demos/23-databricks-rag."
databricks/client-secret:
  source: you
  secure: true
  help: "The service principal release-pipeline's OAuth secret, shown once when you generate it: workspace Settings, Identity and access, Service principals, release-pipeline, Secrets, Generate secret."
runbook-assistant/staging:
  source: terraform
  secure: false
  help: "What staging's runbook assistant runs, as JSON: version, package SHA-256, index. Terraform makes the name (infra/demos/23-databricks-rag); scripts/demos/rag/deploy.py writes it."
runbook-assistant/production:
  source: terraform
  secure: false
  help: "What production's runbook assistant runs, as JSON: version, package SHA-256, index. Terraform makes the name (infra/demos/23-databricks-rag); scripts/demos/rag/deploy.py writes it."
