# Every SSM parameter the platform reads, under /release-demo/<name>.
#
# source: you        you type it into scripts/secrets.py
#         script     a setup script writes it (named in the help)
#         host       the tools host writes it at boot
#         terraform  Terraform generates it or gets it from a provider
#
# Terraform creates the names of everything except the "terraform" ones with
# the value "unset" and never touches the value again. secure: false means a
# plain String: not secret, but still kept out of the public repository.

github/repository:
  source: script
  secure: false
  help: "owner/release-demo. Written by scripts/github_app.py."
github/app-id:
  source: script
  secure: false
  help: "The GitHub App's id. Written by scripts/github_app.py."
github/app-private-key:
  source: script
  secure: true
  help: "The GitHub App's private key (PEM). Written by scripts/github_app.py."

slack/bot-token:
  source: you
  secure: true
  help: "Slack app, OAuth & Permissions, Bot User OAuth Token (xoxb-...)."
  pattern: "^xoxb-"
  hint: "the Bot User OAuth Token starts with xoxb-"
slack/signing-secret:
  source: you
  secure: true
  help: "Slack app, Basic Information, App Credentials, Signing Secret (click Show). Not the App-Level Token (xapp-)."
  pattern: "^[0-9a-f]{32}$"
  hint: "a signing secret is 32 characters, 0-9 and a-f"
slack/channel-id:
  source: you
  secure: false
  help: "#releases: click the channel name, the Channel ID at the bottom (C...). A channel link works too."
  pattern: "^[CG][A-Z0-9]{8,}$"
  hint: "a channel id starts with C and has 9 or more capitals and digits"
slack/member-id/mateusz:
  source: you
  secure: false
  help: "Your Slack member id: your profile, the three dots, Copy member ID (U...)."
  pattern: "^[UW][A-Z0-9]{8,}$"
  hint: "a member id starts with U and has 9 or more capitals and digits"
slack/member-id/sam:
  source: you
  secure: false
  help: "Sam Developer's Slack member id: his profile, the three dots, Copy member ID (U...)."
  pattern: "^[UW][A-Z0-9]{8,}$"
  hint: "a member id starts with U and has 9 or more capitals and digits"

servicenow/instance-url:
  source: you
  secure: true
  help: "Your PDI's URL, https://devNNNNNN.service-now.com."
  pattern: "^https://dev[0-9]+\\.service-now\\.com$"
servicenow/admin-password:
  source: you
  secure: true
  help: "Password of the ServiceNow setup user release-demo.setup (roles admin and snc_basic_auth_api_access), which servicenow_setup.py signs in as."
servicenow/sam-password:
  source: you
  secure: true
  help: "A password you choose for Sam Developer in ServiceNow. You sign in as Sam."
servicenow/alex-password:
  source: you
  secure: true
  help: "A password you choose for Alex Change Manager in ServiceNow. You sign in as Alex to approve."
servicenow/release-pipeline-password:
