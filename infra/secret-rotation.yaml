jcr/token:
  rotation: {by: script, rotator: jcr}
jcr/store-fleet-token:
  rotation: {by: hand, how: "scripts/demos/windows/jcr_token.py makes a new one; revoke the old one in JFrog, Administration, Access Tokens"}

jenkins/release-bot-api-token:
