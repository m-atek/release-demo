# How each secret in parameters.yaml rotates: the secrets inventory of video 10,
# printed by scripts/secrets.py inventory (--html for dist/secrets-inventory.html).
# A test fails when a secure entry of parameters.yaml has no entry here, or an
# entry here names no parameter. Each entry is one of:
#
#   credential: false                         a URL, an id or an email: nothing to rotate
#   rotation: {by: script, rotator: <name>}   scripts/rotate.py <name> does it, end to end
#   rotation: {by: hand, how: "<...>"}        where to click, or the Terraform replace and restart
#
# Kept apart from parameters.yaml, which every demo extends, so this file
# changes only when a rotation does.

github/app-private-key:
  rotation: {by: hand, how: "GitHub, Settings, Developer settings, GitHub Apps, the app, Private keys: generate one, store it in SSM, restart the tools host, delete the old key"}

slack/bot-token:
  rotation: {by: hand, how: "api.slack.com/apps, Release Bot, OAuth & Permissions: Revoke All OAuth Tokens, Reinstall to Workspace, secrets.py set slack/bot-token"}
slack/signing-secret:
  rotation: {by: hand, how: "api.slack.com/apps, Release Bot, Basic Information, Signing Secret: Regenerate, secrets.py set slack/signing-secret"}

servicenow/instance-url:
  credential: false
servicenow/admin-password:
  rotation: {by: hand, how: "ServiceNow as admin, Users, release-demo.setup, Set Password, secrets.py set servicenow/admin-password"}
servicenow/sam-password:
  rotation: {by: hand, how: "secrets.py set servicenow/sam-password, then servicenow_setup.py sets it"}
servicenow/alex-password:
  rotation: {by: hand, how: "secrets.py set servicenow/alex-password, then servicenow_setup.py sets it"}
servicenow/release-pipeline-password:
  rotation: {by: hand, how: "secrets.py set servicenow/release-pipeline-password --force with a new one, then servicenow_setup.py sets it"}

jira/site-url:
  credential: false
jira/email:
  credential: false
jira/api-token:
  rotation: {by: hand, how: "signed in as Release Pipeline, id.atlassian.com, Security, API tokens: create one, secrets.py set jira/api-token, revoke the old one"}

grafana/stack-url:
  credential: false
grafana/logs-url:
  credential: false
grafana/logs-user:
  credential: false
grafana/logs-token:
  rotation: {by: hand, how: "Grafana Cloud portal, Access Policies, the logs:write policy: add a token, secrets.py set grafana/logs-token, delete the old one"}
grafana/service-account-token:
  rotation: {by: hand, how: "the stack, Administration, Service accounts, release-pipeline: add a token, secrets.py set grafana/service-account-token, delete the old one"}
grafana/external-id:
  credential: false
grafana/metrics-url:
  credential: false
grafana/metrics-user:
  credential: false
grafana/metrics-token:
  rotation: {by: hand, how: "Grafana Cloud portal, Access Policies, the metrics:write policy: add a token, secrets.py set grafana/metrics-token, delete the old one"}
grafana/setup-token:
  rotation: {by: hand, how: "the stack, Administration, Service accounts, release-demo-setup: add a token, secrets.py set grafana/setup-token, delete the old one"}

sonar/token:
  rotation: {by: script, rotator: sonar}

cloudflare/api-token:
  rotation: {by: hand, how: "Cloudflare, My Profile, API Tokens, the demo's token: Roll, secrets.py set cloudflare/api-token"}
cloudflare/account-id:
  credential: false
cloudflare/zone-id:
  credential: false
cloudflare/access-email:
  credential: false

jcr/admin-password:
