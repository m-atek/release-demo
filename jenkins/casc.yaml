# Jenkins configured as code. Secrets are files in /run/secrets, one per value:
# ${jenkins-admin-password} reads /run/secrets/jenkins-admin-password.
# Other ${NAME} values come from the controller's environment (docker-compose.yml).

jenkins:
  systemMessage: "release-demo tools host."
  # Builds run on the tools-host agent only, never on the controller.
  numExecutors: 0
  # Agents connect over WebSocket through the same port as the UI.
  slaveAgentPort: -1
  markupFormatter: plainText

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: Mateusz
          password: ${jenkins-admin-password}
        # Starts every release. The requester is a build parameter.
        - id: release-bot
          name: release-bot
          password: ${jenkins-release-bot-password}

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - Overall/Administer
        - user:
            name: release-bot
            permissions:
              - Overall/Read
              - Job/Read
              - Job/Build
              - Job/Cancel

  nodes:
    - permanent:
        name: tools-host
        labelString: tools-host
        mode: EXCLUSIVE
        numExecutors: 4
        remoteFS: ${AGENT_REMOTE_FS:-/home/jenkins/agent}
        launcher:
          inbound:
            webSocket: true
    # Agents outside the tools host, each connecting out over WebSocket
    # through Cloudflare Access with its own service token. Demo 3's
    # data-center agent, a virtual machine on the Mac:
    - permanent:
        name: dc-agent
        labelString: dc-agent
        mode: EXCLUSIVE
        numExecutors: 1
        remoteFS: /var/lib/jenkins-agent
        launcher:
          inbound:
            webSocket: true
    # Demo 6's build agents (demo 7 builds iOS on the Mac too). Their secrets
    # go to SSM at boot: tools-host/agent_secrets.py.
    - permanent:
        name: mac
        labelString: mac
        mode: EXCLUSIVE
        numExecutors: 1
        remoteFS: /Users/Shared/release-demo-jenkins
        launcher:
          inbound:
            webSocket: true
    - permanent:
        name: windows
        labelString: windows
        mode: EXCLUSIVE
        numExecutors: 1
        remoteFS: 'C:\jenkins'
        launcher:
          inbound:
            webSocket: true

  globalNodeProperties:
    - envVars:
        env:
          - key: JCR_URL
            value: ${JCR_URL}
          - key: SPLUNK_HEC_URL
            value: ${SPLUNK_HEC_URL}

security:
  # The job scripts below are part of this file, which only an admin changes.
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
  # ID tokens for the clouds (demo 5, and 6 and 7): one hour, the plugin's
  # default, with its default claims: sub is the job's URL, plus build_number.
  idToken:
    tokenLifetime: 3600

unclassified:
  location:
    url: ${JENKINS_URL}
  timestamper:
    allPipelines: true
  globalLibraries:
    libraries:
      - name: release-demo
        defaultVersion: main
        allowVersionOverride: false
        retriever:
          modernSCM:
            libraryPath: jenkins/shared-library/
            scm:
              git:
                remote: "https://github.com/${github-repository:-m-atek/release-demo}.git"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: splunk-hec-token
              description: Splunk HTTP Event Collector token
              secret: ${splunk-hec-token}
          - string:
              scope: GLOBAL
              id: sonar-token
              description: SonarQube Cloud token, for the scanner in the quality gate stage
              secret: ${sonar-token:-not-set}
          # Demo 2: the GitHub App publishes check runs on pull requests. Jenkins
          # needs its key in PKCS#8 form, which host_secrets.py writes.
          - gitHubApp:
              id: github-app
              description: The release-demo GitHub App, for pull request check runs
              appID: ${github-app-id:-0}
              privateKey: ${github-app-private-key-pkcs8:-}
          - string:
              scope: GLOBAL
              id: jcr-token
              description: JFrog Container Registry token for the release pipeline (scripts/jcr_setup.py)
              secret: ${jcr-token:-not-set}
          # No stored cloud keys: each binding of these mints an ID token for the
          # build, which one cloud trades for short-lived access. The issuer is
          # a public S3 bucket (infra/demos/5-three-clouds), because the clouds
          # can't reach Jenkins behind Cloudflare Access; the tools host
          # publishes the keys there at boot (scripts/demos/clouds/oidc_issuer.py).
          - idToken:
              scope: GLOBAL
              id: oidc-aws
              description: ID token for AWS. STS trades it for an hour in a deploy role
              audience: sts.amazonaws.com
              issuer: ${jenkins-oidc-issuer:-}
          - idToken:
              scope: GLOBAL
              id: oidc-azure
              description: ID token for Azure. Microsoft Entra trades it for a managed identity's token
              audience: api://AzureADTokenExchange
              issuer: ${jenkins-oidc-issuer:-}
          - idToken:
              scope: GLOBAL
              id: oidc-gcp
              description: ID token for Google Cloud. Workload Identity Federation trades it for an hour as a service account
              audience: release-demo-gcp
              issuer: ${jenkins-oidc-issuer:-}
          # Demo 3: what the data-center servers' rollout on dc-agent needs.
          - string:
              scope: GLOBAL
              id: jcr-inventory-read-token
              description: Read-only JCR token for the inventory servers (scripts/demos/linux/jcr_token.py)
              secret: ${jcr-inventory-read-token:-not-set}
          - string:
              scope: GLOBAL
              id: cloudflare-dc-agent-client-id
              description: Cloudflare Access service token for dc-agent, client id, for JCR through Access
              secret: ${cloudflare-dc-agent-client-id:-not-set}
          - string:
              scope: GLOBAL
              id: cloudflare-dc-agent-client-secret
              description: Cloudflare Access service token for dc-agent, client secret
              secret: ${cloudflare-dc-agent-client-secret:-not-set}
          - string:
              scope: GLOBAL
              id: inventory-app-secret
              description: inventory's stock feed token, for the data-center servers
              secret: ${inventory-app-secret:-not-set}
          # Demo 7: Store Floor's Android upload key, for the signing step in
          # store-floor-build (scripts/demos/mobile/signing_setup.py).
          - file:
              scope: GLOBAL
              id: store-floor-upload-keystore
              description: Store Floor's Android upload key (scripts/demos/mobile/signing_setup.py)
              fileName: upload.p12
              secretBytes: ${store-floor-android-upload-keystore:-bm90LXNldA==}
          - string:
              scope: GLOBAL
              id: store-floor-upload-key-password
              description: The upload keystore's password
              secret: ${store-floor-android-upload-key-password:-not-set}
          # Only when STANDIN drops apple (real Apple signing):
          - string:
              scope: GLOBAL
              id: store-floor-match-password
              description: fastlane match password for Store Floor
              secret: ${store-floor-match-password:-not-set}
          - string:
              scope: GLOBAL
              id: store-floor-apple-team-id
              description: Apple Developer Team ID
              secret: ${store-floor-apple-team-id:-not-set}

jobs:
  - file: /var/jenkins_casc/jobs/jobs.groovy
