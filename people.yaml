# Who plays which part in the demo. Mateusz plays both Sam and Alex.
# Slack member ids live in SSM, slack/member-id/<person>, set with
# scripts/secrets.py set slack; scripts read them through common.people().

mateusz:
  display_name: Mateusz
  slack: true
  servicenow_user: null
  github_login: m-atek

sam:
  display_name: Sam Developer
  slack: true
  servicenow_user: sam.developer
  # Sam has no GitHub account. Pull requests from Mateusz's account map to Sam.
  github_login: m-atek
  releaser: true

alex:
  display_name: Alex Change Manager
  # Alex has no Slack account. Slack shows the name ServiceNow records.
  slack: false
  servicenow_user: alex.change.manager
  approver: true

fiona:
  # Video 18: the cost approver, the only member of Cost approvers in
  # ServiceNow. No Slack account; Slack shows her name as ServiceNow records it.
  display_name: Fiona Finance
  slack: false
  servicenow_user: fiona.finance
  cost_approver: true

ines:
  # Video 11: the auditor. Reads only: the Jenkins job evidence-sample and
  # ServiceNow as ines.auditor (snc_read_only). Never asks for or approves.
  display_name: Ines, auditor
  slack: false
  servicenow_user: ines.auditor
  jenkins_user: ines

coding-agent:
  # Video 16: the coding agent, with its own GitHub App. It writes code, and
  # never asks for, reviews or approves a release: change.py refuses a
  # pull request it wrote without a person's approving review.
  display_name: Coding agent
  agent: true
  slack: false
  servicenow_user: null       # no ServiceNow account at all
  github_login: release-demo-coding-agent-m-atek[bot]

pieter:
  # Demo 19: on call, with break-glass access to production on the cluster
  # host (scripts/demos/argocd/break_glass.py). No Slack account; the cluster's
  # audit log names him by his certificate, pieter-oncall.
  display_name: Pieter On Call
  slack: false
  servicenow_user: pieter.oncall
  kubernetes_user: pieter-oncall
