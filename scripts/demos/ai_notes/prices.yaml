# The prices the platform puts on its own work: scripts/llm.py costs each
# Claude call with them (videos 12 and 13), and the cost check prices a
# release's measured page views (video 18, scripts/demos/cost_gate).
#
# Read from the pages below on the date in "read". Re-read every page, and
# change this date, before a price appears anywhere: in a note, a change,
# Slack, Grafana or a video. Amounts are USD.

read: 2026-10-30

claude:
  source: https://platform.claude.com/docs/en/about-claude/pricing
  # Per million tokens. Thinking bills as output tokens. cache_write is the
  # 5-minute write, the only one the platform asks for.
  per_million_tokens:
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
    # For prompts up to 100,000 tokens, which every call here is. Above that
    # Haiku 5.5 costs 0.50 in, 2.50 out, 0.05 cache reads and 0.625 cache writes.
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}

aws:
  region: eu-west-1
  lambda:
    # The page shows US East's figures; Europe (Ireland) has the same ones in
    # the AWS Price List API (service AWSLambda, effective 2026-10-01).
    source: https://aws.amazon.com/lambda/pricing/
    architecture: x86_64
    per_gb_second: 0.0000166667      # the first 6 billion GB-seconds a month
    per_million_requests: 0.20
  dynamodb:
    # On-demand, Standard table class. The page shows US East's figures (0.125
    # and 0.625); these are Europe (Ireland)'s, from the AWS Price List API
    # (service AmazonDynamoDB, effective 2026-08-01).
    source: https://aws.amazon.com/dynamodb/pricing/on-demand/
    per_million_read_units: 0.1415
    per_million_write_units: 0.705
