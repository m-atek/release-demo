# The UI and API on the node's port 30080, which only the tools host may reach.
apiVersion: v1
kind: Service
metadata: { name: argocd-server }
spec:
  type: NodePort
  ports:
    - { name: http, port: 80, targetPort: 8080, protocol: TCP, nodePort: 30080 }
    - { name: https, port: 443, targetPort: 8080, protocol: TCP }
