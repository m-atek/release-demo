# Sam's group, release-demo:developers. Staging holds the role production has
# before the fix, and the take never changes it: Sam keeps deploy rights there
# on purpose (decision 72), which is why staging holds only its own fake value
# and has Pod Security baseline. To make him read-only in staging instead,
# delete this file's three lines under "deploy rights": check.py sees it.
# production's Role itself is take/before.yaml, shown in the video without a
# label, so on_host.py labels it after applying it. Nothing in jenkins,
# monitoring, kube-system or default, and nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: staging
  labels: { release-demo/demo: can-i }
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  # deploy rights
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: staging
  labels: { release-demo/demo: can-i }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: developer }
subjects:
  - { kind: Group, name: "release-demo:developers", apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: production
  labels: { release-demo/demo: can-i }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: developer }
subjects:
  - { kind: Group, name: "release-demo:developers", apiGroup: rbac.authorization.k8s.io }
