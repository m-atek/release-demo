# Video 33: the second team's namespace on video 8's cluster. Applied by on_host.py
# up, as the cluster admin; on_host.py down removes the namespace and all in it.
# Pod Security baseline, as staging and production have it since video 26.
apiVersion: v1
kind: Namespace
metadata:
  name: forecast
  labels:
    release-demo/demo: hotfix-room
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
---
# The pipeline deploys here with the rights it has in staging and production: the
# same ClusterRole, bound in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-pipeline
  namespace: forecast
  labels:
    release-demo/demo: hotfix-room
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-pipeline }
subjects:
  - { kind: ServiceAccount, name: release-pipeline, namespace: jenkins }
