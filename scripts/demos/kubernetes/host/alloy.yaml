# Grafana Alloy: scrapes kube-state-metrics every 15 seconds and writes the
# two namespaces' series to Grafana Cloud. Applied by host/k3s.py up once the
# grafana/metrics-* parameters are set; the Secret grafana-cloud comes from SSM.
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy, namespace: monitoring }
data:
  config.alloy: |
    prometheus.scrape "kube_state_metrics" {
      targets         = [{"__address__" = "kube-state-metrics.monitoring.svc:8080"}]
      job_name        = "kube-state-metrics"
      scrape_interval = "15s"
      forward_to      = [prometheus.relabel.demo.receiver]
    }

    // Only the two namespaces: far below the free tier's 10,000 series.
    prometheus.relabel "demo" {
      rule {
        source_labels = ["namespace"]
        regex         = "staging|production"
        action        = "keep"
      }
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]
    }

    prometheus.remote_write "grafana_cloud" {
      external_labels = {cluster = "release-demo"}
      endpoint {
        url = sys.env("GRAFANA_METRICS_URL")
        basic_auth {
          username      = sys.env("GRAFANA_METRICS_USER")
          password_file = "/etc/alloy/grafana/token"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy, namespace: monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          args: [run, /etc/alloy/config/config.alloy, --storage.path=/tmp/alloy, --server.http.listen-addr=0.0.0.0:12345]
          env:
            - name: GRAFANA_METRICS_URL
              valueFrom: { secretKeyRef: { name: grafana-cloud, key: url } }
            - name: GRAFANA_METRICS_USER
              valueFrom: { secretKeyRef: { name: grafana-cloud, key: user } }
          readinessProbe:
            httpGet: { path: /-/ready, port: 12345 }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy/config }
            - { name: token, mountPath: /etc/alloy/grafana }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: alloy }
        - name: token
          secret: { secretName: grafana-cloud, items: [{ key: token, path: token }] }
        - name: tmp
          emptyDir: {}
