# What the demo's cluster holds besides the catalog releases: the two
# namespaces, the Jenkins service account with rights in those two only,
# kube-state-metrics for the Grafana panel, and the presenter's access for
# the video's terminal. Applied by host/k3s.py up, as the cluster admin.

apiVersion: v1
kind: Namespace
metadata: { name: staging }
---
apiVersion: v1
kind: Namespace
metadata: { name: production }
---
apiVersion: v1
kind: Namespace
metadata: { name: jenkins }
---
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
# Jenkins deploys as this account. It has no long-lived token: the helper
# makes one per build step with kubectl create token, for 10 minutes.
apiVersion: v1
kind: ServiceAccount
metadata: { name: release-pipeline, namespace: jenkins }
automountServiceAccountToken: false
---
# What helm upgrade, helm rollback and the checks need in one namespace.
# Helm keeps its release records as Secrets in the release's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: release-pipeline }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
# The role is a ClusterRole only so it is written once; these RoleBindings
# grant it in staging and production, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: release-pipeline, namespace: staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-pipeline }
subjects:
  - { kind: ServiceAccount, name: release-pipeline, namespace: jenkins }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: release-pipeline, namespace: production }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-pipeline }
subjects:
  - { kind: ServiceAccount, name: release-pipeline, namespace: jenkins }
---
# The presenter: the Mac's kubeconfig for the video's terminal, a client
# certificate that lasts 8 hours (scripts/demos/kubernetes/connect.sh).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: release-demo-presenters }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: Group, name: "release-demo:presenters", apiGroup: rbac.authorization.k8s.io }
---
# kube-state-metrics: ready pods per version for Grafana. It reads pods and
# deployments in the two namespaces only, and keeps the metrics the panel uses.
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: release-demo-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: kube-state-metrics, namespace: staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-demo-kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: kube-state-metrics, namespace: production }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-demo-kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics, namespace: monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --namespaces=staging,production
            - --resources=pods,deployments
            - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/version]
            - --metric-allowlist=kube_pod_labels,kube_pod_status_ready,kube_pod_container_status_restarts_total,kube_deployment_spec_replicas,kube_deployment_status_replicas_available,kube_deployment_status_replicas_updated
          ports:
            - { name: metrics, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics, namespace: monitoring }
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
