# Ansible for the inventory servers. scripts/demos/linux/fleet.py runs it with
# an inventory it writes for the run: Systems Manager for the cloud servers,
# SSH for the data-center servers.
[defaults]
retry_files_enabled = False
interpreter_python = /usr/bin/python3
gathering = explicit
display_skipped_hosts = False
host_key_checking = True
timeout = 30
forks = 4
nocows = 1

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
