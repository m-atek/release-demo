# One release folder on this server, its settings and the shared secrets.
# The package comes from JFrog Container Registry (cloud servers over the
# VPC with a token from SSM; data-center servers through
# artifactory-demo.es.nl with Jenkins credentials) or, for the starting
# release, from the controller. Either way it is checked by its SHA-256.

- name: Jenkins credentials for this server, in a root-only file for the helper
  when: site == 'data-center'
  ansible.builtin.copy:
    content: |
      JCR_TOKEN={{ lookup('env', 'JCR_TOKEN') }}
      CF_ACCESS_CLIENT_ID={{ lookup('env', 'CF_ACCESS_CLIENT_ID') }}
      CF_ACCESS_CLIENT_SECRET={{ lookup('env', 'CF_ACCESS_CLIENT_SECRET') }}
      INVENTORY_APP_SECRET={{ lookup('env', 'INVENTORY_APP_SECRET') }}
    dest: /run/inventory-release.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Fetch, check and unpack
  block:
    - name: Copy the package from the controller
      when: package is defined and package.source == 'file' and (action == 'deploy' or target_version not in before.releases)
      ansible.builtin.copy:
        src: "{{ package.file }}"
        dest: /opt/inventory/incoming/{{ package.file | basename }}
        mode: "0600"

    - name: Fetch {{ target_version }}, check its SHA-256, unpack it into releases/{{ target_version }}
      when: package is defined and (action == 'deploy' or target_version not in before.releases)
      ansible.builtin.command: >-
        /opt/inventory/bin/inventory-release install
        --version {{ target_version | quote }} --sha256 {{ package.sha256 | quote }}
        {% if package.source == 'file' %}--file /opt/inventory/incoming/{{ package.file | basename | quote }}
        {% else %}--url {{ package.url | quote }}
        {{ '--env-file /run/inventory-release.env' if site == 'data-center' else '--token-ssm ' + (jcr_token_parameter | quote) }}{% endif %}
      register: installed
      changed_when: "'unpacked' in installed.stdout"

    - name: This release's settings, from the template
      ansible.builtin.template:
        src: inventory.properties.j2
        dest: /opt/inventory/releases/{{ target_version }}/conf/inventory.properties
        owner: root
        group: tomcat
        mode: "0644"
      register: settings_file

    - name: The app's secrets, {{ 'from Jenkins credentials' if site == 'data-center' else 'from SSM' }}
      ansible.builtin.command: >-
        /opt/inventory/bin/inventory-release secrets
        {{ '--env-file /run/inventory-release.env' if site == 'data-center' else '--from-ssm ' + (app_secret_parameter | quote) }}
      register: secrets_file
      changed_when: "'written' in secrets_file.stdout"

    - name: Record the step
      ansible.builtin.set_fact:
        steps: "{{ steps + [{'at': lookup('pipe', 'date +%s.%N') | float, 'what': 'installed ' + target_version, 'detail': installed.stdout | default('already there')}] }}"
  always:
    - name: Remove the credentials file
      when: site == 'data-center'
      ansible.builtin.file:
        path: /run/inventory-release.env
        state: absent
