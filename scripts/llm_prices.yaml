# Claude's prices per million tokens, for scripts/llm.py's cost per call.
# Read on 30 October 2026 from https://platform.claude.com/docs/en/about-claude/pricing
# Re-read that page before a price appears anywhere: these only cost the
# platform's own calls, in its logs. cache_write is the 5-minute write.
read: 2026-10-30
source: https://platform.claude.com/docs/en/about-claude/pricing
models:
  claude-haiku-5-5:
    # For prompts up to 100,000 tokens; longer prompts pay long_prompt's prices.
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
    long_prompt: { over: 100000, input: 0.50, output: 2.50, cache_write: 0.625, cache_read: 0.05 }
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.10
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20
