# One entry per service. The stage scripts, the Slack handler, Terraform and
# the local runner all read this file, so a service is described once.

orders-service:
  platform: aws-lambda
  path: services/orders-service
  runtime: python3.13
  handler: handler.handler

  jira:
    project: ORD

  slack:
    # Words allowed after the Jira key in /release orders-service ORD-12 <option>.
    options: [standard]

  scripts:
    build: scripts/build.py
    publish: scripts/publish.py
    deploy: scripts/deploy.py
    check: scripts/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py
    # Video 18: the stage Cost check after Check staging, while
    # scripts/demos/cost_gate/switch.py is on.
    cost_check: scripts/demos/cost_gate/cost_check.py

  servicenow:
    cmdb_item: orders-service
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Routine release of orders-service
      rollback: Rollback of orders-service

  sonarqube:
    # A monorepo project in the organization m-atek: one project per service.
    project_key: m-atek_release-demo_orders-service

  # Videos 12 and 13: Claude's notes, checked by script, while
  # scripts/demos/ai_notes/switch.py is on. A model change is a commit and a
  # release of the platform.
  ai_notes:
    change_summary: true      # normal changes only: a person reads them
    likely_cause: true        # after a failed production check and its rollback
    model: claude-opus-5-5
    effort: {change_summary: medium, likely_cause: medium}
    log_lines: 200

  # Video 18: what the cost check sends to staging, and the month it projects.
  cost_check:
    limit_usd_month: 100            # above it, a cost approver decides
    approvers: Cost approvers
    sample: {page_views: 50, path: /, concurrency: 5}
    expected_month:                 # the team's own estimate; shown in the change and on screen
      page_views: 3000000
      new_orders: 60000

  # Video 16: /agent orders-service <Jira key> <note> hands an issue to the
  # coding agent (scripts/demos/agent_ship), and pull requests that change
  # this service get the release's first four stages as GitHub checks.
  coding_agent:
    model: claude-opus-5-5
    max_turns: 40
    minutes: 20
  pull_requests:
    checks: [Build, Test, Quality gate, SBOM and scan]
    # SonarQube Cloud's Free plan analyses only main, so a pull request is
    # analysed as the main branch of a project of its own. On the OSS plan,
    # drop this and the check runs SonarQube's own pull request analysis.
    sonar_project_key: m-atek_release-demo_orders-service-pull-requests

  environments:
    staging:
      function: orders-service-staging
      alias: live
      local_port: 8001
      settings:
        DELIVERY_ESTIMATE_DAYS: "2"
      check:
        timeout_seconds: 30
        paths: []

    production:
      function: orders-service-production
      alias: live
      local_port: 8002
      settings:
        # Production still carries the setting under its old name. 1.4.1 reads
        # the new name only, passes staging and fails here: configuration drift.
        DELIVERY_DAYS: "2"
      check:
        timeout_seconds: 60
        paths: [/, /api/orders]

pricing-api:
  # Demo 4: an API with a contract check and a canary. Fictional consumers:
  # orders-service and the store app (demo 7).
  platform: aws-lambda-api
  path: services/pricing-api
  jcr: { shared: true }
  runtime: python3.13
  handler: handler.handler

  jira:
    project: ORD

  slack:
    # /release pricing-api ORD-52 call: the shorter canary, for live calls.
    options: [call]

  scripts:
    build: scripts/build.py
    publish: scripts/publish.py
    # Right after SBOM and scan: compare openapi.yaml with production's.
    contract: scripts/demos/apis/contract.py
    deploy: scripts/demos/apis/deploy.py
    check: scripts/demos/apis/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: pricing-api
    assignment_group: Platform team
    approvers: Change approvers
    # Every release that passes the contract check gets the pre-approved
    # standard change, without the word standard after the Jira key.
    change: standard
    templates:
      standard: Routine release of pricing-api
      rollback: Rollback of pricing-api

  sonarqube:
    project_key: m-atek_release-demo_pricing-api

  contract:
    # The OpenAPI file in the package, compared with the one in production's
    # release in JFrog Container Registry. oasdiff's ERR level stops the run.
    openapi: openapi.yaml
    fail_on: ERR

  canary:
    # Production only. The production check gives the new version this share
    # of live for this long, while two CloudWatch alarms watch that version
    # alone (dimension ExecutedVersion). On an alarm its share goes back to 0.
    weight_percent: 10
    minutes: 5
    minutes_on_calls: 3
    poll_seconds: 5
    alarms:
      errors_per_minute: 3        # Errors, sum over one minute, at or above
      p95_duration_ms: 800        # Duration, p95 over one minute, above
    load:
      requests_per_second: 10
      belgian_share: 0.33         # a third of the requests ask for Belgian prices
      lead_seconds: 15            # before the canary, so Grafana shows its share step up from 0
      tail_seconds: 30            # after the decision, so Grafana shows 0% or 100%

  environments:
    staging:
      function: pricing-api-staging
      alias: live
      api_url_parameter: pricing-api/staging/api-url
      check:
        timeout_seconds: 30
        paths: [/products, "/prices/RS-100?store=NL-UTR-01", "/prices/RS-100?store=BE-ANT-01"]

    production:
      function: pricing-api-production
      alias: live
      api_url_parameter: pricing-api/production/api-url
      check:
        timeout_seconds: 60
        paths: [/products, "/prices/RS-100?store=NL-UTR-01", "/prices/RS-100?store=BE-ANT-01"]

catalog:
  # Demo 8: a container on a single-node k3s cluster on the tools host,
  # released with Helm 4. See scripts/demos/kubernetes/.
  platform: kubernetes
  path: services/catalog
  runtime: python3.13
  toolchain: jenkins/toolchain/kubernetes.Dockerfile

  jira:
    project: ORD

  slack:
    options: [standard]

  # The package goes to demos-candidates/catalog/ and demos-releases/catalog/;
  # the image and chart it holds to docker-local and helm-local.
  jcr: { shared: true }

  scripts:
    build: scripts/demos/kubernetes/build.py
    publish: scripts/publish.py
    deploy: scripts/demos/kubernetes/deploy.py
    check: scripts/demos/kubernetes/check.py

  servicenow:
    # One CI per namespace. The change names production's: that is what it changes.
    cmdb_item: catalog-production
    # Every catalog release is a pre-approved standard change, without the option word.
    change: standard
    templates:
      standard: Routine release of catalog
      rollback: Rollback of catalog
    backout_plan: >-
      Automatic: Helm releases with --rollback-on-failure and waits up to 3 minutes for the new pods
      to be ready. If they aren't, Helm rolls back to the previous revision by itself, the old pods
      having served throughout, and the pipeline closes this change as unsuccessful with the rollback
      in its notes. If the production check fails after a release, the pipeline rolls back with helm rollback.

  sonarqube:
    project_key: m-atek_release-demo_catalog

  kubernetes:
    # Where the cluster pulls from: k3s mirrors this name to JCR on the host
    # (registries.yaml), so pulls stay on the host's local network.
    image: artifactory-demo.es.nl/docker-local/catalog
    chart: helm-local/catalog
    registry: http://127.0.0.1:8082
    release: catalog

  environments:
    staging:
      namespace: staging
      cmdb_item: catalog-staging
      replicas: 2
      node_port: 30081
      helm_timeout: 3m
      settings:
        # Set in staging while 1.9.0 was built. Production doesn't have it yet.
        CATALOG_DB_URL: file:///app/data/catalog.json
      check:
        timeout_seconds: 30
        paths: [/ready, /api/products]

    production:
      namespace: production
      cmdb_item: catalog-production
      replicas: 3
      node_port: 30082
      helm_timeout: 3m
      settings: {}
      check:
        timeout_seconds: 60
        paths: [/ready, /api/products]

network-stack:
  platform: terraform
  # Changes arrive as pull requests, not as releases from Slack: the Jenkins
  # multibranch job network-stack runs infra/demos/2-terraform/Jenkinsfile on
  # each one. The CI job on main and /release leave this service out.
  pipeline: pull-request
  path: infra/demos/2-terraform/network
  toolchain: jenkins/toolchain/terraform.Dockerfile
  # Publishes nothing to JFrog; shared, so jcr_setup.py asks for no repositories of its own.
  jcr: { shared: true }

  jira:
    project: ORD

  slack:
    options: []

  scripts:
    checks: scripts/demos/terraform/checks.py
    pull_request: scripts/demos/terraform/pr.py
    drift: scripts/demos/terraform/drift.py
    reset: scripts/demos/terraform/reset.py

  servicenow:
    cmdb_item: network-stack
    assignment_group: Platform team
    approvers: Change approvers
    # Every change is a normal change, approved by Change approvers.
    templates: {}

  terraform:
    plan_role: release-demo-deploy-network-plan
    apply_role: release-demo-deploy-network-apply
    # The pull request the video uses: scripts/demo.sh open-pr terraform.
    demo_branch: demo-2/store-exports
    demo_title: ORD-22 Store exports bucket and queue
    demo_file: infra/demos/2-terraform/network/exports.tf

store-sync:
  # Demo 1: a legacy .NET Framework 4.8 Windows service on six store servers,
  # upgraded in waves through AWS Systems Manager Run Command. No logins, no
  # inbound ports. infra/demos/1-windows creates the fleet.
  platform: windows-fleet
  path: services/store-sync
  toolchain: jenkins/toolchain/dotnet.Dockerfile
  # Packages go to demos-candidates/store-sync/ and demos-releases/store-sync/.
  jcr: { shared: true }

  jira:
    project: ORD

  slack:
    # /release store-sync ORD-31 resume: a new change, linked to the last one,
    # for the servers not on the new version yet.
    options: [resume]

  scripts:
    build: scripts/demos/windows/build.py
    test: scripts/demos/windows/test.sh
    quality_gate: scripts/demos/windows/quality_gate.sh
    publish: scripts/publish.py
    # The Plan stage, before the change: the waves and the change's extras.
    plan: scripts/demos/windows/plan.py
    deploy: scripts/demos/windows/deploy.py
    check: scripts/demos/windows/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: store-sync
    # Each server is a Windows Server CI that runs store-sync, and an affected
    # item of the change: scripts/demos/windows/servicenow_fleet.py.
    server_class: cmdb_ci_win_server
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      rollback: Rollback of store-sync

  sonarqube:
    project_key: m-atek_release-demo_store-sync

  environments:
    # No staging: the first wave, one server alone, is the canary.
    production:
      # The servers are found by these tags and their Name.
      tags: { Project: release-demo, Demo: 1-windows }
      waves:
        - [STORE-001]
        - [STORE-002, STORE-003]
        - [STORE-004, STORE-005]
        - [STORE-006]
      # Never more servers at once than this, whatever the wave.
      parallel: 2
      install_dir: 'C:\StoreSync'
      health_url: http://localhost:8080/health
      # What up and reset.py install: the release before ORD-31.
      baseline:
        version: 3.2.0
        path: demos-releases/store-sync/3.2.0/store-sync-3.2.0.zip
        # The build is reproducible, so the baseline's checksum is fixed:
        # scripts/demos/windows/seed.py checks it, every server verifies it.
        sha256: 1f8afb36d041cf1b01af9201536b7fb3a0d303a64376b34ec93561ce58d4fd52
      prechecks:
        min_free_gb: 5
      check:
        timeout_seconds: 60
      # Made-up stores. The maintenance window is checked before each server,
      # in the store's own time zone; in the demo it is always open.
      servers:
        STORE-001: { store: Amsterdam, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-002: { store: Rotterdam, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-003: { store: Utrecht, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-004: { store: Eindhoven, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-005: { store: The Hague, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-006: { store: Antwerp, timezone: Europe/Brussels, maintenance_window: "Mon-Sun 00:00-24:00" }
      settings:
        UploadEndpoint: https://uploads.eu-west.store-sync.internal/{store_id}
      # Planted on purpose by up and reset.py: STORE-004's config lacks
      # UploadEndpoint. 3.2.0 falls back to a built-in endpoint, 3.3.0 has none.
      # scripts/demo.sh fix-drift windows restores it.
      drift:
        STORE-004: UploadEndpoint

inventory:
  # Demo 3: a legacy Java web app on Tomcat 9 and four Linux servers, two in
  # AWS and two in a data center the cloud can't reach (Multipass virtual
  # machines on the Mac). Ansible deploys it one server at a time. The cloud
  # servers run from the tools-host agent through Systems Manager; the
  # data-center servers from dc-agent, which connects out to Jenkins, over SSH.
  platform: linux-servers
  path: services/inventory
  toolchain: jenkins/toolchain/java.Dockerfile
  jcr: { shared: true }            # demos-candidates/inventory/ and demos-releases/inventory/

  jira:
    project: ORD

  slack:
    options: [standard]

  scripts:
    build: scripts/demos/linux/build.py
    test: scripts/demos/linux/test.py
    publish: scripts/publish.py
    deploy: scripts/demos/linux/deploy.py
    check: scripts/demos/linux/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: inventory
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Routine release of inventory
      rollback: Rollback of inventory
    # Linux Server CIs, made by scripts/demos/linux/servicenow_setup.py. The
    # deploy lists them on the change with each server's result.
    servers: [inv-cloud-01, inv-cloud-02, inv-dc-01, inv-dc-02]

  sonarqube:
    project_key: m-atek_release-demo_inventory
    properties:
      sonar.sources: services/inventory/src/main/java
      sonar.tests: services/inventory/src/test/java
      sonar.java.binaries: services/inventory/target/classes
      sonar.java.test.binaries: services/inventory/target/test-classes
      sonar.coverage.jacoco.xmlReportPaths: .release/reports/jacoco.xml
      sonar.junit.reportPaths: services/inventory/target/surefire-reports

  environments:
    # Production only: the four servers, in this order, one at a time
    # (serial 1, max_fail_percentage 0). Each is checked on its own /health;
    # there is no load balancer. A failed check switches that server's
    # symlink back, restarts Tomcat, checks again and stops the rollout.
    production:
      servers:
        - { name: inv-cloud-01, site: cloud }
        - { name: inv-cloud-02, site: cloud }
        - { name: inv-dc-01, site: data-center }
        - { name: inv-dc-02, site: data-center }
      sites:
        cloud:
          location: AWS eu-west-1
          agent: tools-host        # Ansible over Systems Manager, packages from JCR over the VPC
        data-center:
          location: Data center
          agent: dc-agent          # Ansible over SSH, packages through artifactory-demo.es.nl
          job: inventory-dc-wave
      settings:
        STOCK_FEED_URL: https://stock-feed.example.invalid/v1
      check:
        timeout_seconds: 60

quote-service:
  platform: three-clouds  # AWS Lambda, Azure Container Apps and Google Cloud Run
  path: services/quote-service
  runtime: python3.13     # the image's Python, for SonarQube
  jcr: { shared: true }   # demos-candidates/quote-service/, demos-releases/quote-service/

  jira:
    project: ORD

  slack:
    options: [standard]

  scripts:
    build: scripts/demos/clouds/build.py
    publish: scripts/publish.py
    deploy: scripts/demos/clouds/deploy.py
    check: scripts/demos/clouds/check.py

  # Bound around deploy and check, so the pipeline stores no cloud keys: one
  # Jenkins OpenID Connect credential per cloud, each with that cloud's
  # audience. Every binding mints a fresh ID token for the build, and each
  # cloud trades it for access that expires on its own.
  jenkins_credentials:
    oidc-aws: OIDC_AWS_TOKEN
    oidc-azure: OIDC_AZURE_TOKEN
    oidc-gcp: OIDC_GCP_TOKEN

  servicenow:
    cmdb_item: quote-service
    backout_plan: >-
      Automatic, cloud by cloud: production goes to Google Cloud, Azure and AWS in
      turn, each checked before the next. If a cloud's check fails, the pipeline moves
      that cloud's traffic back to its previous revision or version, checks it, and
      releases to no further cloud. This change then closes as unsuccessful and lists
      the version each cloud runs.
    # One item per cloud, listed on the change as affected items.
    cloud_items:
      aws: quote-service on AWS
      azure: quote-service on Azure
      gcp: quote-service on Google Cloud
    # change.py adds them when the change opens: once it is in Assess,
    # ServiceNow refuses new affected items (Change Model: Read only CI).
    servers: [quote-service on Google Cloud, quote-service on Azure, quote-service on AWS]
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Routine release of quote-service
      rollback: Rollback of quote-service

  sonarqube:
    project_key: m-atek_release-demo_quote-service

  # One image for all three clouds, built by scripts/demos/clouds/build.py.
  image:
    base: public.ecr.aws/docker/library/python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
    adapter: public.ecr.aws/awsguru/aws-lambda-adapter:1.1.0@sha256:17cfd08eff1dfea3f6a9a1e9c65fdac80aa4919b6085e746615530f43f57d2f1
    port: 8080

  # Staging goes to all three, then production cloud by cloud in this order.
  # A failed check moves that cloud back and stops the rest.
  clouds:
    - {key: gcp, name: Google Cloud, region: europe-west4}
    - {key: azure, name: Azure, region: northeurope}
    - {key: aws, name: AWS, region: eu-west-1}

  environments:
    staging:
      check:
        timeout_seconds: 90
        paths: ["/", "/api/quote?amount=120.00&currency=EUR"]
      targets:
        gcp: {name: quote-service-staging, settings: {QUOTE_GBP_RATE: "0.86"}}
        azure: {name: quote-service-staging, settings: {QUOTE_GBP_RATE: "0.86"}}
        aws: {name: quote-service-staging, settings: {QUOTE_GBP_RATE: "0.86"}}

    production:
      check:
        timeout_seconds: 90
        paths: ["/", "/api/quote?amount=120.00&currency=EUR"]
      targets:
        gcp: {name: quote-service-production, settings: {QUOTE_GBP_RATE: "0.86"}}
        # Azure's production app never got QUOTE_GBP_RATE. 1.2.1 reads it,
        # passes staging in every cloud, and fails here: drift in one cloud.
        azure: {name: quote-service-production, settings: {}}
        aws: {name: quote-service-production, settings: {QUOTE_GBP_RATE: "0.86"}}

# Demo 7: Store Floor, a Flutter app for iPhone, iPad and Android phones.
# /release store-floor ORD-80 jamf sends it to the store devices through Jamf,
# pilot first; /release store-floor ORD-81 stores sends it to the testers on
# TestFlight and Google Play's internal track. See scripts/demos/mobile/.
store-floor:
  platform: mobile (iOS and Android)
  path: services/store-floor
  # The build and test scripts run on the tools host itself: they run Flutter
  # in the toolchain container and start store-floor-build, which builds iOS on
  # the Mac agent and Android on the tools host at the same time.
  build_agent: tools-host
  toolchain: jenkins/toolchain/flutter.Dockerfile

  scripts:
    build: scripts/demos/mobile/build.py
    test: scripts/demos/mobile/test.py
    publish: scripts/publish.py
    deploy: scripts/demos/mobile/deploy.py
    check: scripts/demos/mobile/check.py

  settings:
    # Jamf, the Apple Developer Program, TestFlight and Google Play run as
    # stand-ins (docs/adding-a-demo.md, section 5). "0" uses the real APIs, or
    # name the stand-ins to keep, such as "jamf,apple".
    STANDIN: "1"

  app:
    name: Store Floor
    bundle_id: nl.es.demo.storefloor
    package_name: nl.es.demo.storefloor
    flutter: 3.44.0
    build_job: store-floor-build
    ios_agent: mac

  jamf:
    app: Store Floor
    pilot_group: Pilot
    all_group: All store devices
  testflight:
    group: Store team
  google_play:
    track: internal

  jcr:
    shared: true

  jira:
    project: ORD

  slack:
    options: [jamf, stores]

  servicenow:
    cmdb_item: store-floor
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Release of store-floor to testers
      rollback: Rollback of store-floor
    # Options that make a pre-approved standard change: testers only, no
    # store devices. Needs change.py to read it (see the demo's README section).
    standard_options: [stores]

  sonarqube:
    project_key: m-atek_release-demo_store-floor
    properties:
      sonar.sources: services/store-floor/lib,services/store-floor/ios/Runner,services/store-floor/android/app/src/main
      sonar.tests: services/store-floor/test
      sonar.dart.lcov.reportPaths: .release/reports/lcov.info

  environments:
    # TestFlight's processing takes minutes or more; Jamf waits for the devices' report.
    staging:
      check:
        timeout_seconds: 1800
    production:
      check:
        timeout_seconds: 600

# Demo 6: a Mac app through Jamf to a pilot group, then every managed Mac,
# and its Windows twin as a signed MSI. Two build agents make the installers
# (desktop.build_agents); the tools host does the rest. staging is the pilot
# group, production every managed Mac.
store-assistant:
  platform: desktop-macos-windows
  path: services/store-assistant
  jcr: { shared: true }

  settings:
    # 1: Apple (Developer ID, notarization), Microsoft (Artifact Signing) and
    # Jamf run as stand-ins with the same interfaces. STANDIN_APPLE, _JAMF and
    # _MICROSOFT switch one of them. The scripts read them here, on every agent.
    STANDIN: "1"
    STANDIN_NOTARY_SECONDS: "150"

  # Parts built on other agents, in parallel, each from its own checkout,
  # before scripts.build and scripts.test run on the tools host. The pipeline
  # stashes dist/<service>/parts/<label>/ on each agent and unstashes it there.
  build_agents:
    mac:
      build: python3 scripts/demos/desktop/mac_build.py build store-assistant --jira-key "$JIRA_KEY"
      test: python3 scripts/demos/desktop/mac_build.py test store-assistant
    windows:
      build: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/demos/desktop/windows_build.ps1 -Step build -Service store-assistant
      test: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/demos/desktop/windows_build.ps1 -Step test -Service store-assistant

  desktop:
    # The Windows track can be cut here: an open decision.
    tracks: [mac, windows]

  jira:
    project: ORD

  slack:
    options: [standard]

  scripts:
    build: scripts/demos/desktop/combine.py
    test: scripts/demos/desktop/reports.py
    publish: scripts/publish.py
    deploy: scripts/demos/desktop/deploy.py
    check: scripts/demos/desktop/check.py

  servicenow:
    cmdb_item: store-assistant
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Routine release of store-assistant
      rollback: Rollback of store-assistant
      pilot: Pilot of Store Assistant
    backout_plan: >-
      Point the Jamf policy Store Assistant back at the previous package and flush its logs:
      /rollback store-assistant does it in one step, and the Macs in scope reinstall the previous
      version at their next check-in. A rejected rollout leaves the scope on Pilot.
    # Texts for the templates above, for servicenow_setup.py: the shared ones
    # speak of a Lambda alias.
    template_texts:
      pilot:
        short_description: Pilot of Store Assistant
        description: Delivers a new Store Assistant to the Macs in the Jamf group Pilot only, through the Jamf policy Store Assistant.
        implementation_plan: Upload the notarized package from JFrog Container Registry, verified by its SHA-256, to Jamf; point the policy at it; scope it to Pilot; flush the policy's logs.
        backout_plan: Point the policy back at the previous package and flush its logs. The pilot Macs reinstall the previous version at their next check-in.
        test_plan: The pilot Macs report the new version in Jamf inventory.
        justification: A new version reaches the pilot group before every other Mac.
        risk_impact_analysis: Low, the pilot group only, and the rollback is one step.
      standard:
        short_description: Routine release of store-assistant
        description: A pre-approved release of Store Assistant, started from Slack and run by the release pipeline.
        implementation_plan: The pipeline signs, notarizes and stores the installers once, delivers the Mac package through Jamf to Pilot, checks it, then widens the policy's scope to All managed Macs.
        backout_plan: Point the Jamf policy back at the previous package and flush its logs.
        test_plan: Unit tests, the quality gate, an SBOM scan with no critical findings, notarization, and the pilot Macs reporting the new version.
        justification: Routine releases of Store Assistant follow the same automated, tested path every time.
        risk_impact_analysis: Low, the pilot group checks the release first.
      rollback:
        short_description: Rollback of store-assistant
        description: Puts the previous Store Assistant back on the Macs in the policy's scope. Started with /rollback in Slack.
        implementation_plan: Point the Jamf policy Store Assistant at the previous release's package and flush its logs.
        backout_plan: Point the policy at the newer package again.
        test_plan: The Macs in scope report the previous version in Jamf inventory.
        justification: Restores the previous version quickly after a bad release.
        risk_impact_analysis: Low, the Macs return to the version they ran before.

  sonarqube:
    project_key: m-atek_release-demo_store-assistant
    # SonarQube Cloud reads Swift with the scanner the pipeline runs. C# needs
    # the SonarScanner for .NET on the Windows agent, so it is left out here.
    properties:
      sonar.sources: services/store-assistant/mac/Sources
      sonar.tests: services/store-assistant/mac/Tests
      sonar.coverageReportPaths: .release/reports/coverage-mac.xml
      # The SwiftUI views have no unit tests (the pilot Mac is their test), so
      # coverage counts StoreAssistantCore, where the logic and its tests are.
      sonar.coverage.exclusions: services/store-assistant/mac/Sources/StoreAssistant/**

  jamf:
    policy: Store Assistant
    pilot_group: Pilot
    all_group: All managed Macs

  windows:
    test_instance: release-demo-desktop-test
    build_agent: release-demo-desktop-build
    product: { name: Store Assistant, folder: Expeditious Software\Store Assistant }
    # WiX 5.0.2, which has no fee (Mateusz's choice).
    wix_sdk: WixToolset.Sdk/5.0.2

  environments:
    staging:
      label: Pilot
      jamf_scope: Pilot
      check:
        # The pilot Mac updates at its next check-in (every 15 minutes), or
        # at once with sudo jamf policy.
        timeout_seconds: 1200
        report_groups: [Pilot]
        show_groups: [All managed Macs]
    production:
      label: All managed Macs
      jamf_scope: All managed Macs
      check:
        timeout_seconds: 900
        report_groups: [Pilot]
        show_groups: [All managed Macs]
