# One entry per service. The stage scripts, the Slack handler, Terraform and
# the local runner all read this file, so a service is described once.

orders-service:
  platform: aws-lambda
  path: services/orders-service
  runtime: python3.13
  handler: handler.handler

  jira:
    project: ORD

  slack:
    # Words allowed after the Jira key in /release orders-service ORD-12 <option>.
    options: [standard]

  scripts:
    build: scripts/build.py
    publish: scripts/publish.py
    deploy: scripts/deploy.py
    check: scripts/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: orders-service
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      standard: Routine release of orders-service
      rollback: Rollback of orders-service

  sonarqube:
    # A monorepo project in the organization m-atek: one project per service.
    project_key: m-atek_release-demo_orders-service

  environments:
    staging:
      function: orders-service-staging
      alias: live
      local_port: 8001
      settings:
        DELIVERY_ESTIMATE_DAYS: "2"
      check:
        timeout_seconds: 30
        paths: []

    production:
      function: orders-service-production
      alias: live
      local_port: 8002
      settings:
        # Production still carries the setting under its old name. 1.4.1 reads
        # the new name only, passes staging and fails here: configuration drift.
        DELIVERY_DAYS: "2"
      check:
        timeout_seconds: 60
        paths: [/, /api/orders]

pricing-api:
  # Demo 4: an API with a contract check and a canary. Fictional consumers:
  # orders-service and the store app (demo 7).
  platform: aws-lambda-api
  path: services/pricing-api
  jcr: { shared: true }
  runtime: python3.13
  handler: handler.handler

  jira:
    project: ORD

  slack:
    # /release pricing-api ORD-52 call: the shorter canary, for live calls.
    options: [call]

  scripts:
    build: scripts/build.py
    publish: scripts/publish.py
    # Right after SBOM and scan: compare openapi.yaml with production's.
    contract: scripts/demos/apis/contract.py
    deploy: scripts/demos/apis/deploy.py
    check: scripts/demos/apis/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: pricing-api
    assignment_group: Platform team
    approvers: Change approvers
    # Every release that passes the contract check gets the pre-approved
    # standard change, without the word standard after the Jira key.
    change: standard
    templates:
      standard: Routine release of pricing-api
      rollback: Rollback of pricing-api

  sonarqube:
    project_key: m-atek_release-demo_pricing-api

  contract:
    # The OpenAPI file in the package, compared with the one in production's
    # release in JFrog Container Registry. oasdiff's ERR level stops the run.
    openapi: openapi.yaml
    fail_on: ERR

  canary:
    # Production only. The production check gives the new version this share
    # of live for this long, while two CloudWatch alarms watch that version
    # alone (dimension ExecutedVersion). On an alarm its share goes back to 0.
    weight_percent: 10
    minutes: 5
    minutes_on_calls: 3
    poll_seconds: 5
    alarms:
      errors_per_minute: 3        # Errors, sum over one minute, at or above
      p95_duration_ms: 800        # Duration, p95 over one minute, above
    load:
      requests_per_second: 10
      belgian_share: 0.33         # a third of the requests ask for Belgian prices
      lead_seconds: 15            # before the canary, so Grafana shows its share step up from 0
      tail_seconds: 30            # after the decision, so Grafana shows 0% or 100%

  environments:
    staging:
      function: pricing-api-staging
      alias: live
      api_url_parameter: pricing-api/staging/api-url
      check:
        timeout_seconds: 30
        paths: [/products, "/prices/RS-100?store=NL-UTR-01", "/prices/RS-100?store=BE-ANT-01"]

    production:
      function: pricing-api-production
      alias: live
      api_url_parameter: pricing-api/production/api-url
      check:
        timeout_seconds: 60
        paths: [/products, "/prices/RS-100?store=NL-UTR-01", "/prices/RS-100?store=BE-ANT-01"]

catalog:
  # Demo 8: a container on a single-node k3s cluster on the tools host,
  # released with Helm 4. See scripts/demos/kubernetes/.
  platform: kubernetes
  path: services/catalog
  runtime: python3.13
  toolchain: jenkins/toolchain/kubernetes.Dockerfile

  jira:
    project: ORD

  slack:
    options: [standard]

  # The package goes to demos-candidates/catalog/ and demos-releases/catalog/;
  # the image and chart it holds to docker-local and helm-local.
  jcr: { shared: true }

  scripts:
    build: scripts/demos/kubernetes/build.py
    publish: scripts/publish.py
    deploy: scripts/demos/kubernetes/deploy.py
    check: scripts/demos/kubernetes/check.py

  servicenow:
    # One CI per namespace. The change names production's: that is what it changes.
    cmdb_item: catalog-production
    # Every catalog release is a pre-approved standard change, without the option word.
    change: standard
    templates:
      standard: Routine release of catalog
      rollback: Rollback of catalog
    backout_plan: >-
      Automatic: Helm releases with --rollback-on-failure and waits up to 3 minutes for the new pods
      to be ready. If they aren't, Helm rolls back to the previous revision by itself, the old pods
      having served throughout, and the pipeline closes this change as unsuccessful with the rollback
      in its notes. If the production check fails after a release, the pipeline rolls back with helm rollback.

  sonarqube:
    project_key: m-atek_release-demo_catalog

  kubernetes:
    # Where the cluster pulls from: k3s mirrors this name to JCR on the host
    # (registries.yaml), so pulls stay on the host's local network.
    image: artifactory-demo.es.nl/docker-local/catalog
    chart: helm-local/catalog
    registry: http://127.0.0.1:8082
    release: catalog

  environments:
    staging:
      namespace: staging
      cmdb_item: catalog-staging
      replicas: 2
      node_port: 30081
      helm_timeout: 3m
      settings:
        # Set in staging while 1.9.0 was built. Production doesn't have it yet.
        CATALOG_DB_URL: file:///app/data/catalog.json
      check:
        timeout_seconds: 30
        paths: [/ready, /api/products]

    production:
      namespace: production
      cmdb_item: catalog-production
      replicas: 3
      node_port: 30082
      helm_timeout: 3m
      settings: {}
      check:
        timeout_seconds: 60
        paths: [/ready, /api/products]

network-stack:
  platform: terraform
  # Changes arrive as pull requests, not as releases from Slack: the Jenkins
  # multibranch job network-stack runs infra/demos/2-terraform/Jenkinsfile on
  # each one. The CI job on main and /release leave this service out.
  pipeline: pull-request
  path: infra/demos/2-terraform/network
  toolchain: jenkins/toolchain/terraform.Dockerfile
  # Publishes nothing to JFrog; shared, so jcr_setup.py asks for no repositories of its own.
  jcr: { shared: true }

  jira:
    project: ORD

  slack:
    options: []

  scripts:
    checks: scripts/demos/terraform/checks.py
    pull_request: scripts/demos/terraform/pr.py
    drift: scripts/demos/terraform/drift.py
    reset: scripts/demos/terraform/reset.py

  servicenow:
    cmdb_item: network-stack
    assignment_group: Platform team
    approvers: Change approvers
    # Every change is a normal change, approved by Change approvers.
    templates: {}

  terraform:
    plan_role: release-demo-deploy-network-plan
    apply_role: release-demo-deploy-network-apply
    # The pull request the video uses: scripts/demo.sh open-pr terraform.
    demo_branch: demo-2/store-exports
    demo_title: ORD-22 Store exports bucket and queue
    demo_file: infra/demos/2-terraform/network/exports.tf

store-sync:
  # Demo 1: a legacy .NET Framework 4.8 Windows service on six store servers,
  # upgraded in waves through AWS Systems Manager Run Command. No logins, no
  # inbound ports. infra/demos/1-windows creates the fleet.
  platform: windows-fleet
  path: services/store-sync
  toolchain: jenkins/toolchain/dotnet.Dockerfile

  jira:
    project: ORD

  slack:
    # /release store-sync ORD-31 resume: a new change, linked to the last one,
    # for the servers not on the new version yet.
    options: [resume]

  scripts:
    build: scripts/demos/windows/build.py
    test: scripts/demos/windows/test.sh
    quality_gate: scripts/demos/windows/quality_gate.sh
    publish: scripts/publish.py
    plan: scripts/demos/windows/plan.py
    deploy: scripts/demos/windows/deploy.py
    check: scripts/demos/windows/check.py
    change: scripts/change.py
    notify: scripts/notify.py
    events: scripts/events.py

  servicenow:
    cmdb_item: store-sync
    # Each server is a Windows Server CI that runs store-sync, and an affected
    # item of the change: scripts/demos/windows/servicenow_fleet.py.
    server_class: cmdb_ci_win_server
    assignment_group: Platform team
    approvers: Change approvers
    templates:
      rollback: Rollback of store-sync

  sonarqube:
    project_key: m-atek_release-demo_store-sync

  environments:
    # No staging: the first wave, one server alone, is the canary.
    production:
      # The servers are found by these tags and their Name.
      tags: { Project: release-demo, Demo: 1-windows }
      waves:
        - [STORE-001]
        - [STORE-002, STORE-003]
        - [STORE-004, STORE-005]
        - [STORE-006]
      # Never more servers at once than this, whatever the wave.
      parallel: 2
      install_dir: 'C:\StoreSync'
      health_url: http://localhost:8080/health
      # What up and reset.py install: the release before ORD-31.
      baseline:
        version: 3.2.0
        path: store-sync-releases/3.2.0/store-sync-3.2.0.zip
        # The build is reproducible, so the baseline's checksum is fixed:
        # scripts/demos/windows/seed.py checks it, every server verifies it.
        sha256: 1f8afb36d041cf1b01af9201536b7fb3a0d303a64376b34ec93561ce58d4fd52
      prechecks:
        min_free_gb: 5
      check:
        timeout_seconds: 60
      # Made-up stores. The maintenance window is checked before each server,
      # in the store's own time zone; in the demo it is always open.
      servers:
        STORE-001: { store: Amsterdam, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-002: { store: Rotterdam, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-003: { store: Utrecht, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-004: { store: Eindhoven, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-005: { store: The Hague, timezone: Europe/Amsterdam, maintenance_window: "Mon-Sun 00:00-24:00" }
        STORE-006: { store: Antwerp, timezone: Europe/Brussels, maintenance_window: "Mon-Sun 00:00-24:00" }
      settings:
        UploadEndpoint: https://uploads.eu-west.store-sync.internal/{store_id}
      # Planted on purpose by up and reset.py: STORE-004's config lacks
      # UploadEndpoint. 3.2.0 falls back to a built-in endpoint, 3.3.0 has none.
      # scripts/demo.sh fix-drift windows restores it.
      drift:
        STORE-004: UploadEndpoint
