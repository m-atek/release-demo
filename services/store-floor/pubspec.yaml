name: store_floor
description: "Store Floor, the app store staff carry on the shop floor. Demo system, not a client's."
publish_to: 'none'

# The build sets the store version and build number with --build-name and
# --build-number. This one only has to match VERSION, which a test checks.
version: 2.4.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
