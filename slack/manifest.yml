# The Slack app for the release demo. Create it at api.slack.com/apps, From a
# manifest. Both commands post to the Slack handler's function URL, which
# exists once Terraform has created the handler. The repository is public, so
# the URL stays out of it: `.venv/bin/python scripts/slack_manifest.py` prints
# this manifest with the URL filled in, to paste into the app's App Manifest
# page. No buttons: approval is in ServiceNow.

display_information:
  name: Release Bot
  description: Starts releases and rollbacks for the release demo, and reports how they go.
  background_color: "#14181f"

features:
  bot_user:
    display_name: Release Bot
    always_online: true
  slash_commands:
    - command: /release
      url: https://REPLACE-WITH-SLACK-HANDLER-URL.invalid/
      description: Start a release
      usage_hint: "<service> <Jira key> [option]"
      should_escape: false
    - command: /rollback
      url: https://REPLACE-WITH-SLACK-HANDLER-URL.invalid/
      description: Roll production back to the previous version
      usage_hint: "<service>"
      should_escape: false
    # Video 16: a Jira issue for the coding agent, which works on its own credentials.
    - command: /agent
      url: https://REPLACE-WITH-SLACK-HANDLER-URL.invalid/
      description: Hand a Jira issue to the coding agent
      usage_hint: "<service> <Jira key> <note>"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      # Video 10: scripts/rotate.py jcr looks for the leaked token in #releases' last 100 messages.
      - channels:history
      - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
